<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d7a4d"/>
      <stop offset="1" stop-color="#06412a"/>
    </linearGradient>
    <radialGradient id="shineW" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e8eef4"/>
      <stop offset="1" stop-color="#b7c3cf"/>
    </radialGradient>
    <radialGradient id="shineB" cx="30%" cy="30%" r="70%">
      <stop offset="0" stop-color="#3a3a42"/>
      <stop offset="0.55" stop-color="#111117"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="6"/>

  <!-- board grid lines -->
  <g stroke="rgba(0,0,0,0.22)" stroke-width="4">
    <path d="M512 96 V928 M96 512 H928"/>
  </g>
  <g stroke="rgba(255,255,255,0.10)" stroke-width="2">
    <path d="M512 96 V928 M96 512 H928"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="440" cy="440" r="235" fill="url(#shineW)" stroke="rgba(0,0,0,0.18)" stroke-width="6"/>
    <circle cx="600" cy="600" r="235" fill="url(#shineB)" stroke="rgba(255,255,255,0.14)" stroke-width="6"/>
  </g>
  <circle cx="360" cy="360" r="60" fill="rgba(255,255,255,0.35)"/>
</svg>
